  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#050505">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
  <div class="screen">
    <div class="hud"><span>1P&nbsp;&nbsp;00</span><span class="hi">404</span></div>

    <main class="attract">

    </footer>
  </div>
  <script src="/assets/keys.js"></script>
  <script>
    // Hover and focus move the menu bar, as on the homepage.
    const items = [...document.querySelectorAll('.menu a')];
    const set = el => items.forEach(i => i.classList.toggle('on', i === el));
    items.forEach(el => { el.addEventListener('mouseenter', () => set(el)); el.addEventListener('focus', () => set(el)); });
  </script>
</body>
